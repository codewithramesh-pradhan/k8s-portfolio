name: CI — Build, Push & Update Image Tag

# ── When to run ───────────────────────────────────────────────────────────────
# This workflow represents the CI→GitOps handoff:
#   1. App source code lives in a separate repo (e.g. my-static-website).
#   2. That repo's CI builds & pushes the Docker image, then calls this workflow
#      via repository_dispatch.  You can also trigger it manually with a tag.
#
# In a real setup, the app repo would do:
#   curl -X POST https://api.github.com/repos/ORG/k8s-portfolio/dispatches \
#     -H "Authorization: Bearer $TOKEN" \
#     -d '{"event_type":"image-built","client_payload":{"image_tag":"v1.2.3"}}'
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to build and deploy (e.g. v1.2.3)"
        required: true
        type: string

  repository_dispatch:
    types: [image-built]

env:
  REGISTRY: docker.io
  IMAGE_NAME: rameshpradhan88/my-static-website
  MANIFEST_PATH: apps/portfolio/deployment.yaml

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve tag — from manual input or repository_dispatch payload
      - name: Resolve image tag
        id: resolve-tag
        run: |
          TAG="${{ github.event.inputs.image_tag || github.event.client_payload.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "ERROR: No image_tag provided."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag resolved to: $TAG"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NOTE: This repo doesn't contain the Dockerfile — in a real split-repo
      # setup the app repo builds the image. We demonstrate the push step here
      # so the workflow is complete and runnable from this repo for portfolio
      # purposes. Remove this step when this is triggered from the app repo.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          # Point to a subdirectory if you ever add a Dockerfile here,
          # or swap in the pre-built image in a real split-repo setup.
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    name: Bump Image Tag in Manifest (GitOps handoff)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in deployment.yaml
        id: bump-tag
        run: |
          NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          MANIFEST="${{ env.MANIFEST_PATH }}"

          OLD_LINE=$(grep "image:" "$MANIFEST")
          echo "Before: $OLD_LINE"

          # Replace the tag portion of the image line
          sed -i -E \
            "s|(image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}):.*|\1:${NEW_TAG}|" \
            "$MANIFEST"

          NEW_LINE=$(grep "image:" "$MANIFEST")
          echo "After:  $NEW_LINE"

          if git diff --quiet "$MANIFEST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag was already at $NEW_TAG — no commit needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push tag bump
        if: steps.bump-tag.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.MANIFEST_PATH }}
          git commit -m "chore: bump image tag to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push
