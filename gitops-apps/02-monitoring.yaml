apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # 1. Official Helm Chart — values loaded from Git via the $values ref below
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 58.0.0
      helm:
        valueFiles:
          - $values/infrastructure/monitoring/values-kube-prometheus.yaml

    # 2. Git repo: provides Helm values ($values ref) AND the SealedSecret via Kustomize
    - repoURL: 'https://github.com/codewithramesh-pradhan/k8s-portfolio.git'
      targetRevision: HEAD
      ref: values

    - repoURL: 'https://github.com/codewithramesh-pradhan/k8s-portfolio.git'
      targetRevision: HEAD
      path: infrastructure/monitoring

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Admission webhook secret — cert data is generated at runtime
    - group: ""
      kind: Secret
      name: monitoring-kube-prometheus-admission
      jsonPointers:
        - /data
    # Webhook caBundle is injected by cert-manager / kube at runtime
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    # Prometheus operator sets clusterIP and other runtime fields on Services
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
    # HPA / replicas managed at runtime
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
