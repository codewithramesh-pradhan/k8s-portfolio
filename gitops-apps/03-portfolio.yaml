apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-application
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/codewithramesh-pradhan/k8s-portfolio.git'
    targetRevision: HEAD
    path: apps/portfolio
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true