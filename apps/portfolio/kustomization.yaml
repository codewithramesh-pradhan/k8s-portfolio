apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

# Labels added to metadata only — does NOT mutate immutable selector fields
labels:
  - pairs:
      app.kubernetes.io/part-of: portfolio-project
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
    includeTemplates: true

# All manifests managed by this Kustomize overlay
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - servicemonitor.yaml

# Patch the ServiceMonitor back to the monitoring namespace
# (kustomize namespace: portfolio would override it otherwise)
patches:
  - target:
      kind: ServiceMonitor
      name: portfolio-monitor
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: monitoring