apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

# Common labels applied to all generated resources
commonLabels:
  app.kubernetes.io/part-of: portfolio-project
  app.kubernetes.io/managed-by: argocd

# All manifests managed by this Kustomize overlay
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - servicemonitor.yaml
  - sealed-secret.yaml