apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: static-website-hpa
  namespace: portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: static-website
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      averageUtilization: 50