apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portfolio-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  namespaceSelector:
    matchNames:
      - portfolio
  endpoints:
    - port: http
      interval: 15s
      path: /