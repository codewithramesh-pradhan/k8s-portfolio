kubectl create secret generic website-db-credentials \
  --namespace portfolio \
  --from-literal=DB_USERNAME="portfolio_admin" \
  --from-literal=DB_PASSWORD="your-secure-password" \
  --dry-run=client -o yaml | \
  kubeseal --controller-namespace kube-system \
           --controller-name sealed-secrets-controller \
           --format yaml > apps/portfolio/sealed-secret.yaml