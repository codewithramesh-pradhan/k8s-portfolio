# Kind cluster config optimised for a 16GB RAM laptop
# 1 control-plane + 2 workers — enough for the full stack without thrashing memory

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: k8s-portfolio

nodes:
  - role: control-plane
    # Resource limits for the control-plane node
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        systemReserved:
          memory: "256Mi"
          cpu: "100m"
        evictionHard:
          memory.available: "200Mi"

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        systemReserved:
          memory: "256Mi"
          cpu: "100m"
        evictionHard:
          memory.available: "200Mi"

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        systemReserved:
          memory: "256Mi"
          cpu: "100m"
        evictionHard:
          memory.available: "200Mi"

# Port mappings so port-forwards aren't needed for the main services
# (optional — bootstrap.sh uses kubectl port-forward anyway, so these are a bonus)
# Uncomment if you want direct host access without port-forward:
# - role: control-plane
#   extraPortMappings:
#     - containerPort: 80
#       hostPort: 80
#       protocol: TCP
